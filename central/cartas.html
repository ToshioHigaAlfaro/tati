<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cartas ♥</title>
<style>
  

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    background:
      linear-gradient(rgba(5,7,15,.9), rgba(5,7,15,.96)),
      url('flores/img/cartas.jpg') no-repeat center center fixed;
    background-size:cover;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    color:#fff;min-height:100vh;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 16px
            calc(env(safe-area-inset-bottom,0px) + 40px);
    overflow-x:hidden;
  }

  .wrap{max-width:460px;margin:0 auto}

  .volver{
    display:inline-flex;align-items:center;gap:6px;
    font-size:.72rem;letter-spacing:1px;color:#ff88a2;
    text-decoration:none;padding:7px 13px;margin-bottom:24px;
    border:1px solid rgba(255,51,75,.35);border-radius:20px;
    background:rgba(20,10,15,.6);backdrop-filter:blur(6px);
  }
  .volver:active{background:rgba(255,51,75,.25)}

  header h1{
    font-size:1.85rem;font-weight:900;letter-spacing:3px;
    text-shadow:0 0 14px #ff334b, 0 0 30px rgba(255,51,75,.55);
  }
  header p{margin-top:8px;font-size:.82rem;color:#ffd6df;line-height:1.55}
  header{margin-bottom:26px}

  /* --- SOBRES --- */
  .sobres{display:grid;gap:14px}

  .sobre{
    position:relative;width:100%;border:none;cursor:pointer;
    text-align:left;font-family:inherit;color:#fff;
    background:linear-gradient(150deg, #2a1119, #170a11);
    border:1px solid rgba(255,51,75,.4);
    border-radius:12px;padding:20px 18px 18px;
    box-shadow:0 8px 22px rgba(0,0,0,.55);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .sobre:active{transform:scale(.975)}
  .sobre:focus-visible{outline:2px solid #ff88a2;outline-offset:3px}

  /* la solapa del sobre */
  .sobre::before{
    content:'';position:absolute;top:0;left:0;right:0;height:42px;
    background:linear-gradient(160deg, rgba(255,51,75,.28), rgba(255,51,75,.06));
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    border-radius:12px 12px 0 0;
  }
  .sello{
    position:absolute;top:26px;left:50%;transform:translateX(-50%);
    width:24px;height:24px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff6b83, #b8001f);
    display:grid;place-items:center;font-size:.7rem;
    box-shadow:0 0 12px rgba(255,51,75,.7);
  }

  .sobre .para{
    display:block;margin-top:34px;font-size:.64rem;
    letter-spacing:1.6px;color:#ff88a2;font-weight:600;
  }
  .sobre .asunto{
    display:block;margin-top:6px;font-size:1rem;font-weight:700;line-height:1.3;
  }
  .sobre .abrir{
    display:block;margin-top:10px;font-size:.7rem;color:#9e8f95;
  }

  /* --- CARTA ABIERTA --- */
  .lector{
    position:fixed;inset:0;z-index:50;
    background:rgba(4,4,9,.92);backdrop-filter:blur(10px);
    display:none;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px
            calc(env(safe-area-inset-bottom,0px) + 16px);
    overflow-y:auto;
  }
  .lector.visible{display:flex}

  .papel{
    width:100%;max-width:420px;margin:auto;
    background:linear-gradient(#fdf6ec, #f6ead9);
    color:#3a2a22;border-radius:6px;
    padding:30px 26px 34px;
    box-shadow:0 24px 60px rgba(0,0,0,.7);
    font-family:Georgia,'Times New Roman',serif;
    transform-origin:top center;
    animation:desplegar .38s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes desplegar{
    from{opacity:0;transform:scaleY(.72) translateY(-14px)}
    to{opacity:1;transform:scaleY(1) translateY(0)}
  }

  .papel .encabezado{
    font-size:.68rem;letter-spacing:1.4px;color:#a8635f;
    font-family:'Segoe UI',sans-serif;font-weight:600;
    padding-bottom:10px;margin-bottom:16px;
    border-bottom:1px solid rgba(168,99,95,.28);
  }
  .papel h2{
    font-size:1.25rem;line-height:1.3;margin-bottom:14px;font-weight:normal;
  }
  .papel .cuerpo{font-size:.95rem;line-height:1.85}
  .papel .cuerpo p{margin-bottom:14px}
  .papel .firma{
    margin-top:22px;font-size:1.05rem;font-style:italic;color:#8c4a48;
  }

  .cerrar{
    display:block;width:100%;margin-top:24px;padding:12px;
    background:transparent;border:1px solid rgba(58,42,34,.3);
    border-radius:8px;color:#6b4f44;font-family:'Segoe UI',sans-serif;
    font-size:.78rem;letter-spacing:1px;cursor:pointer;
  }
  .cerrar:active{background:rgba(58,42,34,.08)}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<audio id="musica" src="flores/sound/music1.mp3" loop></audio>

<div class="wrap">
  <a href="rincon.html" class="volver">← Volver al rincón</a>

  <header>
    <h1>CARTAS</h1>
    <p>Toca un sobre para abrirlo. Están todos escritos para ti.</p>
  </header>

  <div class="sobres" id="sobres"></div>
</div>

<!-- Lector de cartas -->
<div class="lector" id="lector">
  <article class="papel" id="papel"></article>
</div>

<script>
/* ===================================================================
   TUS CARTAS
   Cada carta va entre { }. Copia un bloque entero para agregar otra.
   Usa un "p" nuevo por cada párrafo.
   =================================================================== */
const cartas = [
  {
    fecha: "Escrita una noche cualquiera",
    asunto: "Lo primero que quiero decirte",
    parrafos: [
      "Hay cosas que se me hace más fácil escribir que decir en voz alta. Esta es una de ellas.",
      "Desde que llegaste, las cosas simples empezaron a importarme más. Un mensaje tuyo a media tarde, saber que ya llegaste bien, escuchar una canción y acordarme de ti sin querer. Nada de eso era parte de mi día antes, y ahora no sabría cómo quitarlo.",
      "No sé exactamente cuándo pasó. Solo sé que un día me di cuenta de que pensaba en ti a todas horas y que me gustaba que fuera así.",
      "Gracias por quedarte, por tenerme paciencia en los días en que no soy fácil, y por hacer que valga la pena todo lo que nos separa."
    ],
    firma: "Tuyo, siempre"
  },
  {
    fecha: "Para cuando el día esté pesado",
    asunto: "Léeme si te sientes mal",
    parrafos: [
      "Si abriste esta carta es porque hoy no fue un buen día. Está bien. No todos tienen que serlo.",
      "Quiero que sepas que lo que estés sintiendo ahora no dice nada de lo que vales. Los días malos mienten mucho: te hacen creer que no puedes, que no eres suficiente, que todo el esfuerzo fue en vano. Nada de eso es cierto.",
      "Yo te he visto salir adelante de cosas que te parecían imposibles. Te he visto levantarte cuando tenías todas las razones para no hacerlo. Esa eres tú, aunque hoy no lo sientas.",
      "No tienes que resolverlo todo esta noche. Descansa, come algo, respira. Mañana lo vemos juntos.",
      "Y si necesitas hablar, escríbeme a la hora que sea. No hay hora mala para ti."
    ],
    firma: "Aquí sigo, siempre"
  },
  {
    fecha: "Para el futuro",
    asunto: "Lo que quiero que vivamos",
    parrafos: [
      "Me gusta imaginarnos sin la distancia. Despertar y que estés ahí, no en una pantalla.",
      "Quiero las mañanas lentas de domingo, discutir sobre qué vamos a cocinar y terminar pidiendo comida. Quiero conocer los lugares que me has contado y que me los enseñes tú. Quiero una casa donde suene música y no importe qué hora es.",
      "Quiero también lo aburrido: hacer las compras, pagar cuentas, ordenar el desorden. Porque eso también es vida, y la quiero contigo.",
      "Sé que falta camino. Pero cada día que pasa es un día menos, y yo no me voy a ningún lado.",
      "Nos vemos en todo eso."
    ],
    firma: "Con todo lo que soy"
  }
];

const contenedor = document.getElementById('sobres');
const lector = document.getElementById('lector');
const papel = document.getElementById('papel');

contenedor.innerHTML = cartas.map((c, i) => `
  <button class="sobre" data-i="${i}">
    <span class="sello">♥</span>
    <span class="para">${c.fecha}</span>
    <span class="asunto">${c.asunto}</span>
    <span class="abrir">Toca para abrir</span>
  </button>
`).join('');

contenedor.addEventListener('click', e => {
  const boton = e.target.closest('.sobre');
  if (!boton) return;
  const c = cartas[boton.dataset.i];

  papel.innerHTML = `
    <div class="encabezado">${c.fecha}</div>
    <h2>${c.asunto}</h2>
    <div class="cuerpo">${c.parrafos.map(p => `<p>${p}</p>`).join('')}</div>
    <div class="firma">${c.firma} ♥</div>
    <button class="cerrar" id="cerrar">Guardar la carta</button>
  `;
  lector.classList.add('visible');
  document.body.style.overflow = 'hidden';
  document.getElementById('cerrar').addEventListener('click', cerrarCarta);
});

function cerrarCarta(){
  lector.classList.remove('visible');
  document.body.style.overflow = '';
}

lector.addEventListener('click', e => { if (e.target === lector) cerrarCarta(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarCarta(); });

/* --- Música --- */
const musica = document.getElementById('musica');
musica.volume = 0.45;
musica.play().catch(() => {
  const desbloquear = () => {
    musica.play();
    document.removeEventListener('click', desbloquear);
    document.removeEventListener('touchstart', desbloquear);
  };
  document.addEventListener('click', desbloquear);
  document.addEventListener('touchstart', desbloquear);
});
</script>
</body>
</html>
