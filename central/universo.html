<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nuestro Universo ♥</title>
<style>


  *{box-sizing:border-box;margin:0;padding:0}

  body{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(90,20,45,.55), transparent 60%),
      linear-gradient(rgba(5,7,15,.88), rgba(5,7,15,.96)),
      url('flores/img/galaxia.jpeg') no-repeat center center fixed;
    background-size:cover;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    color:#fff;
    min-height:100vh;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 16px
            calc(env(safe-area-inset-bottom,0px) + 40px);
    overflow-x:hidden;
  }

  /* --- ESTRELLAS DE FONDO --- */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{
    position:absolute;border-radius:50%;background:#fff;
    animation:twinkle var(--dur) ease-in-out infinite alternate;
    animation-delay:var(--delay);
  }
  @keyframes twinkle{from{opacity:.12;transform:scale(.7)}to{opacity:.9;transform:scale(1)}}

  .wrap{position:relative;z-index:1;max-width:460px;margin:0 auto}

  /* --- VOLVER --- */
  .volver{
    display:inline-flex;align-items:center;gap:6px;
    font-size:.72rem;letter-spacing:1px;color:#ff88a2;
    text-decoration:none;padding:7px 13px;margin-bottom:22px;
    border:1px solid rgba(255,51,75,.35);border-radius:20px;
    background:rgba(20,10,15,.6);backdrop-filter:blur(6px);
  }
  .volver:active{background:rgba(255,51,75,.25)}

  /* --- PORTADA --- */
  .portada{text-align:center;margin-bottom:34px}
  .orbe{
    width:96px;height:96px;margin:0 auto 18px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #ff9ab0, #ff334b 55%, #6d0018 100%);
    box-shadow:0 0 40px rgba(255,51,75,.55), inset -10px -12px 24px rgba(0,0,0,.55);
    position:relative;
    animation:flotar 6s ease-in-out infinite;
  }
  .orbe::after{
    content:'';position:absolute;inset:-16px -34px;border-radius:50%;
    border:1px solid rgba(255,136,162,.4);
    transform:rotate(-18deg);
  }
  @keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  .portada h1{
    font-size:1.9rem;font-weight:900;letter-spacing:3px;line-height:1.1;
    text-shadow:0 0 14px #ff334b, 0 0 30px rgba(255,51,75,.6);
  }
  .portada p{
    margin-top:10px;font-size:.84rem;color:#ffd6df;line-height:1.55;
  }

  /* --- LÍNEA DE TIEMPO --- */
  .linea{position:relative;padding-left:34px}
  .linea::before{
    content:'';position:absolute;left:11px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(to bottom, transparent, #ff334b 12%, #ff334b 88%, transparent);
    opacity:.55;
  }

  .momento{position:relative;margin-bottom:26px}
  .momento::before{
    content:'';position:absolute;left:-29px;top:6px;
    width:14px;height:14px;border-radius:50%;
    background:#ff334b;
    box-shadow:0 0 0 4px rgba(255,51,75,.18), 0 0 14px rgba(255,51,75,.9);
  }

  .fecha{
    font-size:.66rem;letter-spacing:1.6px;color:#ff88a2;font-weight:600;
    display:block;margin-bottom:4px;
  }
  .momento h2{
    font-size:1rem;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.25;
  }
  .momento p{
    font-size:.82rem;line-height:1.6;color:#d8cdd2;
  }

  /* --- DESTINOS --- */
  .destinos{margin-top:38px}
  .destinos h3{
    font-size:.72rem;letter-spacing:2px;color:#ff88a2;
    text-align:center;margin-bottom:14px;font-weight:600;
  }
  .puertas{display:grid;gap:12px}
  .puerta{
    display:block;text-decoration:none;color:#fff;
    background:rgba(20,10,15,.72);
    border:1px solid rgba(255,51,75,.35);border-radius:16px;
    padding:16px 18px;backdrop-filter:blur(8px);
    box-shadow:0 6px 20px rgba(0,0,0,.45);
    transition:transform .18s ease, border-color .18s ease;
  }
  .puerta:active{transform:scale(.97);border-color:#ff334b}
  .puerta strong{display:block;font-size:.95rem;margin-bottom:4px}
  .puerta span{font-size:.72rem;color:#bfb2b8}
  .puerta .icono{font-size:1.3rem;display:block;margin-bottom:7px}

  .cierre{
    margin-top:36px;text-align:center;font-size:.78rem;
    color:#ffd6df;line-height:1.7;
  }
  .cierre em{color:#ff88a2;font-style:normal;font-weight:600}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<audio id="musica" src="flores/sound/music2.mp3" loop></audio>
<div class="stars" id="stars"></div>

<div class="wrap">

  <a href="rincon.html" class="volver">← Volver al rincón</a>

  <header class="portada">
    <div class="orbe"></div>
    <h1>NUESTRO<br>UNIVERSO</h1>
    <p>Cada fecha de aquí es una estrella que no se apaga.</p>
  </header>

  <section class="linea" id="linea"></section>

  <section class="destinos">
    <h3>DOS LUGARES PARA VISITAR</h3>
    <div class="puertas">
      <a href="../universos/Galaxia-del-Amor.html" class="puerta">
        <span class="icono">🌌</span>
        <strong>Galaxia del Amor</strong>
        <span>Un viaje entre estrellas para ti</span>
      </a>
      <a href="../universos/Saturno-de-Amor.html" class="puerta">
        <span class="icono">🪐</span>
        <strong>Saturno de Amor</strong>
        <span>Con anillos que giran sin parar</span>
      </a>
    </div>
  </section>

  <p class="cierre">
    Si el universo tiene millones de planetas,<br>
    yo me quedo con <em>el nuestro</em>.
  </p>

</div>

<script>
/* ===================================================================
   MOMENTOS DE NUESTRA HISTORIA
   Edita, agrega o borra momentos aquí. Salen en orden de arriba abajo.
   =================================================================== */
const momentos = [
  {
    fecha: "30 DE OCTUBRE",
    titulo: "El día en que todo empezó",
    texto: "Ese día pasó algo que no esperaba: empezamos nosotros. Desde entonces me gusto mucho tu compañía"
  },
  {
    fecha: "NUESTRA PRIMERA CONVERSACIÓN",
    titulo: "Hablar contigo y perder la noción del tiempo",
    texto: "No recuerdo bien de qué hablamos primero, pero sí recuerdo que no quería que la conversación terminara. Esa fue la primera señal de que algo estaba empezando."
  },
  {
    fecha: "LA PRIMERA VEZ QUE CONECTAMOS",
    titulo: "Y supe que no quería irme a otro lado",
    texto: "Hay momentos que se quedan grabados sin pedir permiso. Ese fue uno de ellos: verte y sentir que algo en mí cambiaba de lugar."
  },
  {
    fecha: "LOS DÍAS DE DISTANCIA",
    titulo: "Aprendiendo a querernos desde lejos",
    texto: "No ha sido fácil, pero cada mensaje y cada llamada valió la pena. La distancia probó lo que sentimos, y lo que sentimos sigue aquí."
  },
  {
    fecha: "HOY",
    titulo: "Seguimos escribiendo",
    texto: "Y todavía nos queda el resto de la historia por contar, juntos."
  }
];
const linea = document.getElementById('linea');
linea.innerHTML = momentos.map(m => `
  <article class="momento">
    <span class="fecha">${m.fecha}</span>
    <h2>${m.titulo}</h2>
    <p>${m.texto}</p>
  </article>
`).join('');

/* --- Estrellas --- */
const cielo = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.2 + 0.8;
  s.style.width = s.style.height = size + 'px';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
  s.style.setProperty('--delay', (Math.random() * 4) + 's');
  cielo.appendChild(s);
}

/* --- Música (los navegadores piden un toque antes de sonar) --- */
const musica = document.getElementById('musica');
musica.volume = 0.5;
musica.play().catch(() => {
  const desbloquear = () => {
    musica.play();
    document.removeEventListener('click', desbloquear);
    document.removeEventListener('touchstart', desbloquear);
  };
  document.addEventListener('click', desbloquear);
  document.addEventListener('touchstart', desbloquear);
});
</script>
</body>
</html>
